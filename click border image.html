<html>
<body id="mybody">
    <img id="images" src="images.JPEG" width="600" height="500" style="display:none">
    <button id="actionButton">Click Me!</button>
    <p id="messageText">Waiting for your click..</p>
    <script>
        const button = document.getElementById("actionButton");
        const textMessage = document.getElementById("messageText");
        const image=document.getElementById("images");
        const body=document.getElementById("mybody");
        function handleButtonClick(){
            textMessage.textContent="Avengers displayed!";
            image.style.display="block";
        }
        button.addEventListener("click",handleButtonClick);
        image.addEventListener("click",function(){
            image.style.border="5px solid pink";
        })
        </script>
        </body>
        </html>
